
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Form</title>
</head>
<body>

    <header>
        <h1>Student Information Form</h1>
        <p>Please fill in your details correctly.</p>
    </header>

    <main>
        <section>
            <h2>Student Registration</h2>

            <form action="#" method="post">

                <div>
                    <label for="student-name">Student Name:</label>
                    <input type="text" id="student-name"
                           name="student_name" required>
                </div>

                <br>

                <div>
                    <label for="matric-number">
                        Matriculation Number:
                    </label>
                    <input type="text" id="matric-number"
                           name="matric_number" required>
                </div>

                <br>

                <div>
                    <label for="department">Department:</label>
                    <select id="department" name="department" required>
                        <option value="">-- Select Department --</option>
                        <option value="Computer Science">
                            Computer Science
                        </option>
                        <option value="Information Communication Technology">
                            Information Communication Technology
                        </option>
                        <option value="Cyber Security">
                            Cyber Security
			</option>
                        <option value="Data Science">
                            Data Science
			</option>
                        <option value="Software Engineering">
                            Software Engineering
                        </option>
                        <option value="Information Communication">
                            Information Communication
                        </option>
                        <option value="Information System">Information System</option>
                    </select>
                </div>

                <br>

                <fieldset>
                    <legend>Gender:</legend>

                    <input type="radio" id="male"
                           name="gender" value="Male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female"
                           name="gender" value="Female">
                    <label for="female">Female</label>
                </fieldset>

                <br>

                <div>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="e.g. 08012345678"
                           required>
                </div>

                <br>

                <div>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email"
                           placeholder="example@email.com"
                           required>
                </div>

                <br>

                <fieldset>
                    <legend>Program:</legend>

                    <input type="radio" id="full-time"
                           name="program" value="Full Time" required>
                    <label for="full-time">Full Time</label>

                    <input type="radio" id="part-time"
                           name="program" value="Part Time">
                    <label for="part-time">Part Time</label>
                </fieldset>

                <br>

                <button type="submit">Submit</button>
                <button type="reset">Clear Form</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student Registration Form</p>
    </footer>

</body>
</html>
